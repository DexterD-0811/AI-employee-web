<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
  <title>Agent HQ</title>
  <meta name="description" content="Agent HQ: a 3D office where you watch, manage and report on your AI employees.">
  <link rel="icon" type="image/svg+xml" href="/favicon.svg">
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Fredoka:wght@400;500;600;700&display=swap">
</head>
<body>
<div id="app">
  <canvas id="scene" tabindex="0" aria-label="3D view of the Agent HQ office and the town around it. Drag to rotate, scroll to zoom, click a person to select them."></canvas>

  <section class="panel hud-tl" aria-label="Team status">
    <div class="tl-head">
      <div class="logo" aria-hidden="true"><span></span></div>
      <div class="tl-title">
        <h1>Agent HQ</h1>
        <p id="floorline">Digital workspace · Floor 1</p>
      </div>
      <div class="clock" title="Local time"><span class="live" aria-hidden="true"></span><span id="clock">--:--</span></div>
    </div>
    <div class="chips" id="chips" role="group" aria-label="Filter people by status"></div>
    <div class="util"><div class="bar" id="bar" aria-hidden="true"></div><span id="utiltext"></span></div>
    <div class="manage" role="group" aria-label="Boards and reports">
      <button class="mbtn" type="button" data-open="tasks"><svg width="16" height="16" viewBox="0 0 16 16" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><rect x="1.5" y="2" width="4" height="11" rx="1"/><rect x="6.5" y="2" width="4" height="7" rx="1"/><rect x="11.5" y="2" width="3" height="9" rx="1"/></svg>Task board</button>
      <button class="mbtn" type="button" data-open="assigned"><svg width="16" height="16" viewBox="0 0 16 16" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><circle cx="5.5" cy="5" r="2.5"/><path d="M1 14c0-2.5 2-4 4.5-4s4.5 1.5 4.5 4"/><path d="M11 6h4M11 9h4M12 12h3"/></svg>Assigned</button>
      <button class="mbtn" type="button" data-open="goals"><svg width="16" height="16" viewBox="0 0 16 16" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><circle cx="8" cy="8" r="6.5"/><circle cx="8" cy="8" r="3.5"/><circle cx="8" cy="8" r=".6"/></svg>Weekly goals</button>
      <button class="mbtn lock" type="button" data-open="reports"><svg width="16" height="16" viewBox="0 0 16 16" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M2 14V2M2 14h12"/><path d="M5 11V8M8 11V5M11 11V7"/></svg>Reports</button>
    </div>
    <p class="hint">Drag to rotate 360° · Right-drag or Shift-drag to pan · Scroll to zoom · Click a person</p>
  </section>

  <section class="panel card" id="card" aria-label="Selected person" aria-live="polite">
    <div class="card-head">
      <div class="portrait" id="portrait" aria-hidden="true">
        <div class="torso"></div><div class="head"></div><div class="hair"></div>
        <div class="eye" style="left:21px"></div><div class="eye" style="left:31px"></div><div class="smile"></div>
      </div>
      <div class="who"><h2 id="c-name">Nova</h2><p id="c-role">Research agent</p></div>
      <span class="pill" id="c-pill">Working</span>
    </div>
    <div class="task"><b id="c-task">—</b><small id="c-meta">—</small></div>
    <div class="card-actions">
      <div class="stepper">
        <button class="icon-btn" id="prev" type="button" aria-label="Previous person"><svg width="16" height="16" viewBox="0 0 16 16" fill="none" stroke="currentColor" stroke-width="2.2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M10 3 5 8l5 5"/></svg></button>
        <button class="icon-btn" id="next" type="button" aria-label="Next person"><svg width="16" height="16" viewBox="0 0 16 16" fill="none" stroke="currentColor" stroke-width="2.2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="m6 3 5 5-5 5"/></svg></button>
      </div>
      <button class="btn" id="follow" type="button" aria-pressed="false">Follow</button>
      <button class="btn" id="msg" type="button">Message</button>
      <button class="btn primary" id="assign" type="button">Assign task</button>
    </div>
  </section>

  <aside class="panel drawer" id="drawer" hidden aria-label="Boards and reports">
    <div class="dr-head">
      <div class="tabs" role="tablist" aria-label="Boards and reports">
        <button class="tab" role="tab" type="button" data-tab="tasks" aria-selected="true">Task board</button>
        <button class="tab" role="tab" type="button" data-tab="assigned" aria-selected="false">Assigned</button>
        <button class="tab" role="tab" type="button" data-tab="goals" aria-selected="false">Weekly goals</button>
        <button class="tab" role="tab" type="button" data-tab="reports" aria-selected="false">Reports</button>
      </div>
      <button class="icon-btn" id="dr-close" type="button" aria-label="Close panel"><svg width="16" height="16" viewBox="0 0 16 16" fill="none" stroke="currentColor" stroke-width="2.2" stroke-linecap="round" aria-hidden="true"><path d="m4 4 8 8M12 4l-8 8"/></svg></button>
    </div>
    <div class="dr-body" id="dr-body" role="tabpanel"></div>
  </aside>

  <nav class="panel toolbar" aria-label="Camera controls">
    <button class="compass" id="compass" type="button" aria-label="Face north" title="Face north">
      <span class="needle" id="needle"><b>N</b><svg width="18" height="18" viewBox="0 0 18 18" aria-hidden="true"><path d="M9 2 12 9H6z" fill="#ff6b5e"/><path d="M9 16 6 9h6z" fill="#e9eef5"/></svg></span>
    </button>
    <button class="tb sq" id="rotL" type="button" aria-label="Rotate left 45 degrees" title="Rotate left (Q)"><svg width="20" height="20" viewBox="0 0 20 20" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M4 10a6 6 0 1 0 2-4.5"/><path d="M4 3v3h3"/></svg></button>
    <button class="tb sq" id="rotR" type="button" aria-label="Rotate right 45 degrees" title="Rotate right (E)"><svg width="20" height="20" viewBox="0 0 20 20" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M16 10a6 6 0 1 1-2-4.5"/><path d="M16 3v3h-3"/></svg></button>
    <span class="sep" aria-hidden="true"></span>
    <button class="tb view" data-view="iso" type="button" aria-pressed="true" title="Isometric (1)">Iso</button>
    <button class="tb view" data-view="top" type="button" aria-pressed="false" title="Top-down (2)">Top</button>
    <button class="tb view" data-view="front" type="button" aria-pressed="false" title="Front (3)">Front</button>
    <button class="tb view" data-view="street" type="button" aria-pressed="false" title="Street level (4)">Street</button>
    <button class="tb view" data-view="wide" type="button" aria-pressed="false" title="Wide overview (5)">Overview</button>
    <span class="sep" aria-hidden="true"></span>
    <button class="tb" id="auto" type="button" aria-pressed="false" title="Auto-rotate (R)"><svg width="18" height="18" viewBox="0 0 20 20" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" aria-hidden="true"><ellipse cx="10" cy="10" rx="8" ry="3.5"/><path d="M14 6.8 18 6.5l-1.5 3.5"/></svg>360°</button>
    <button class="tb" id="walls" type="button" aria-pressed="true" title="Cut away walls (W)">Cutaway</button>
    <button class="tb" id="city" type="button" aria-pressed="true" title="Show the town around the office (C)">Town</button>
    <button class="tb" id="quality" type="button" aria-pressed="false" title="Sharper picture with shadows (slower)">Sharp</button>
    <span class="sep" aria-hidden="true"></span>
    <button class="tb sq" id="zoomOut" type="button" aria-label="Zoom out" title="Zoom out (-)"><svg width="18" height="18" viewBox="0 0 18 18" fill="none" stroke="currentColor" stroke-width="2.4" stroke-linecap="round" aria-hidden="true"><path d="M4 9h10"/></svg></button>
    <button class="tb sq" id="zoomIn" type="button" aria-label="Zoom in" title="Zoom in (+)"><svg width="18" height="18" viewBox="0 0 18 18" fill="none" stroke="currentColor" stroke-width="2.4" stroke-linecap="round" aria-hidden="true"><path d="M4 9h10M9 4v10"/></svg></button>
  </nav>

  <div class="toast" id="toast" role="status" hidden></div>
  <div class="loading" id="loading">Building the office…</div>
</div>
<script type="module" src="/src/main.js"></script>
</body>
</html>
