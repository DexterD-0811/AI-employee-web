<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
  <title>Little Faith Bots</title>
  <meta name="description" content="Little Faith Bots: the Little Faith Club team room, where you watch, approve and pause your AI employees.">
  <link rel="icon" type="image/png" href="/stickers/emblem.png">
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Fredoka:wght@500;600&family=Nunito:wght@600;700;800&family=Andika:wght@700&display=swap">
</head>
<body>
<canvas id="scene" tabindex="0" aria-label="3D view of the Little Faith Bots team room. Drag to turn it all the way round, scroll or pinch to zoom, tap a bot or their desk to see what they are working on."></canvas>

<div class="hud">
  <div class="col left">
    <section class="card hello" aria-label="Little Faith Bots">
      <img class="sticker" src="/stickers/moon.png" alt="" style="width: 64px; right: -4px; top: -6px; transform: rotate(-8deg)">
      <div class="brand"><img src="/stickers/emblem.png" alt="Little Faith Club emblem"><div><b>Little Faith Bots</b><br><span>Team room</span></div></div>
      <h1 id="greet">Good evening</h1>
      <p id="teamline">Your team</p>
      <div class="chips" id="chips" role="group" aria-label="Show bots by status"></div>
      <div class="acct"><span id="mode">Demo team room</span><button class="linkbtn" id="acct" type="button">Sign in</button></div>
    </section>
  </div>

  <div class="col right">
    <section class="card bot-card" id="botCard" aria-live="polite" aria-label="Selected employee">
      <img class="sticker" src="/stickers/star.png" alt="" style="width: 50px; right: -14px; top: -22px; transform: rotate(12deg)">
      <div class="bot-head">
        <div class="bot-face"><canvas id="faceCv" width="92" height="92"></canvas></div>
        <div class="who"><h2 id="botName">—</h2><p id="botRole">—</p></div>
        <span class="state" id="botState"><i></i>—</span>
      </div>
      <div class="doing"><b id="botDoing">—</b><small id="botWhere">—</small></div>
      <div class="row">
        <button class="btn" type="button" id="follow" aria-pressed="false">Follow</button>
        <button class="btn" type="button" id="pause">Pause</button>
        <button class="btn gold" type="button" id="work">Their work</button>
      </div>
    </section>

    <section class="card yes" aria-label="Waiting for your yes">
      <img class="sticker" src="/stickers/heart.png" alt="" style="width: 52px; right: -12px; top: -24px; transform: rotate(10deg)">
      <h2>Waiting for your yes</h2>
      <p>Nothing goes out to families until you approve it</p>
      <div id="yesList" class="yes-list"></div>
    </section>
  </div>
</div>

<div class="cam" role="group" aria-label="Camera">
  <div class="seg" role="group" aria-label="View">
    <button type="button" data-view="room" aria-pressed="true">Team room</button>
    <button type="button" data-view="above" aria-pressed="false">From above</button>
    <button type="button" data-view="close" aria-pressed="false">Close up</button>
  </div>
  <button class="round" type="button" id="spin" aria-pressed="false" aria-label="Turn slowly all the way round"><svg width="22" height="22" viewBox="0 0 22 22" fill="none" stroke="#1e2452" stroke-width="2.4" stroke-linecap="round" aria-hidden="true"><ellipse cx="11" cy="11" rx="8.5" ry="4"></ellipse><path d="M15.5 7.4 19.6 7l-1.2 3.8"></path></svg></button>
  <button class="round" type="button" id="sky" aria-label="Switch to morning"><img id="skyIcon" src="/stickers/sun.png" alt="" width="30" height="30"></button>
</div>

<aside class="drawer card" id="drawer" hidden aria-labelledby="drTitle">
  <div class="dr-head">
    <h2 id="drTitle">Your yes</h2>
    <button class="round small" type="button" id="drClose" aria-label="Back to the team room"><svg width="16" height="16" viewBox="0 0 16 16" fill="none" stroke="#1e2452" stroke-width="2.4" stroke-linecap="round" aria-hidden="true"><path d="m4 4 8 8M12 4l-8 8"></path></svg></button>
  </div>
  <div class="dr-body" id="drBody"></div>
</aside>

<nav class="tabs" aria-label="Little Faith Bots">
  <ul>
    <li><button type="button" data-tab="room" aria-current="page"><svg width="22" height="22" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M3 11.5 12 4l9 7.5"></path><path d="M5.5 10v10h13V10"></path><path d="M10 20v-5h4v5"></path></svg><span>Team<span class="long"> room</span></span></button></li>
    <li><button type="button" data-tab="yes"><svg width="22" height="22" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M12 20.5s-7.5-4.6-7.5-10A4.5 4.5 0 0 1 12 7.6a4.5 4.5 0 0 1 7.5 2.9c0 5.4-7.5 10-7.5 10z"></path></svg><span>Your yes</span><span class="n" id="yesN" hidden>0</span></button></li>
    <li><button type="button" data-tab="board"><svg width="22" height="22" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M4 6h16M4 12h16M4 18h10"></path></svg><span>Work<span class="long"> board</span></span></button></li>
    <li><button type="button" data-tab="week"><svg width="22" height="22" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><circle cx="12" cy="12" r="8"></circle><circle cx="12" cy="12" r="4"></circle></svg><span>This week</span></button></li>
    <li><button type="button" data-tab="reports"><svg width="22" height="22" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M5 20V10M12 20V5M19 20v-7"></path></svg><span>Reports</span></button></li>
  </ul>
</nav>

<div class="loading" id="loading">Opening the team room…</div>
<div class="toast" id="toast" role="status" hidden></div>
<script type="module" src="/src/main.js"></script>
</body>
</html>
